const firebaseConfig = {
apiKey: "AIzaSyDUr6cxFEdkOpXjKTpGil8-sAor_CbdUXU",
authDomain: "notas-clase-1d0d4.firebaseapp.com",
projectId: "notas-clase-1d0d4",
storageBucket: "notas-clase-1d0d4.firebasestorage.app",
messagingSenderId: "352792565163",
appId: "1:352792565163:web:f4e2f088603852f803eeee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const dataRef = doc(db, "classroom", "data");
const filesCol = collection(db, "classroom_files");

window.__loadData = async function () {
const snap = await getDoc(dataRef);
if (snap.exists()) return snap.data();
return null;
};

window.__saveData = async function (data) {
await setDoc(dataRef, data);
return true;
};

window.__listFiles = async function () {
const snap = await getDocs(filesCol);
const list = [];
snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
list.sort((a, b) => (b.uploadedAt || 0) - (a.uploadedAt || 0));
return list;
};

window.__uploadFile = async function (file) {
await addDoc(filesCol, { ...file, uploadedAt: Date.now() });
return true;
};

window.__deleteFile = async function (id) {
await deleteDoc(doc(db, "classroom_files", id));
return true;
};

// Señal de que Firebase ya está listo para usarse
window.__firebaseReady = true;
window.dispatchEvent(new Event("firebase-ready"));
</script>

function generateId() {
return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function normalizeName(value) {
var from = "áéíóúüñÁÉÍÓÚÜÑ";
var to = "aeiouunAEIOUUN";
var s = (value || "").toString().trim().replace(/\s+/g, " ").toLowerCase();
var result = "";
for (var i = 0; i < s.length; i++) {
var idx = from.indexOf(s[i]);
result += idx >= 0 ? to[idx] : s[i];
}
return result;
}

function deepClone(obj) {
return JSON.parse(JSON.stringify(obj));
}

function toNumber(v) {
if (v === undefined || v === null) return NaN;
var s = String(v).trim().replace(",", ".");
if (s === "") return NaN;
var n = Number(s);
return isFinite(n) ? n : NaN;
}

function averageValid(nums) {
var valid = nums.filter(function (n) { return !isNaN(n); });
if (!valid.length) return null;
var sum = valid.reduce(function (a, b) { return a + b; }, 0);
return Math.round(sum / valid.length);
}

function withCriterioValue(buffer, studentId, area, criterio, idx, value) {
var next = deepClone(buffer || {});
if (!next[studentId]) next[studentId] = {};
if (!next[studentId][area]) next[studentId][area] = { criterios: {}, recuperacion: "" };
if (!next[studentId][area].criterios) next[studentId][area].criterios = {};
if (!next[studentId][area].criterios[criterio]) next[studentId][area].criterios[criterio] = ["", "", "", ""];
next[studentId][area].criterios[criterio][idx] = value;
return next;
}

function withRecuperacionValue(buffer, studentId, area, value) {
var next = deepClone(buffer || {});
if (!next[studentId]) next[studentId] = {};
if (!next[studentId][area]) next[studentId][area] = { criterios: {}, recuperacion: "" };
next[studentId][area].recuperacion = value;
return next;
}

function withComportamientoValue(buffer, studentId, field, value, idx) {
var next = deepClone(buffer || {});
if (!next[studentId]) next[studentId] = { b: ["", "", "", ""], final: "", recuperacion: "" };
if (field === "b") next[studentId].b[idx] = value;
else next[studentId][field] = value;
return next;
}

function migrateData(loaded) {
var out = { ...emptyData(), ...loaded };
if (loaded && Array.isArray(loaded.subjects) && !Array.isArray(loaded.areas)) {
var migratedGrades = {};
Object.keys(loaded.grades || {}).forEach(function (studentId) {
migratedGrades[studentId] = {};
Object.keys(loaded.grades[studentId] || {}).forEach(function (subj) {
var val = loaded.grades[studentId][subj];
migratedGrades[studentId][subj] = { criterios: {}, recuperacion: "" };
migratedGrades[studentId][subj].criterios[subj] = [val || "", "", "", ""];
});
});
out.areas = loaded.subjects.map(function (s) { return { name: s, criterios: [s] }; });
out.grades = migratedGrades;
}
if (!Array.isArray(out.areas)) out.areas = [];
if (!out.grades) out.grades = {};
if (!out.comportamiento) out.comportamiento = {};
return out;
}

function waitForFirebase() {
return new Promise((resolve) => {
if (window.__firebaseReady) return resolve();
window.addEventListener("firebase-ready", () => resolve(), { once: true });
});
}

function readFileAsDataURL(file) {
return new Promise((resolve, reject) => {
const reader = new FileReader();
reader.onload = () => resolve(reader.result);
reader.onerror = () => reject(reader.error);
reader.readAsDataURL(file);
});
}

function App() {
const [loading, setLoading] = useState(true);
const [data, setData] = useState(emptyData());
const [error, setError] = useState("");
const [session, setSession] = useState(null);
const [saving, setSaving] = useState(false);
const [files, setFiles] = useState([]);
const [filesLoading, setFilesLoading] = useState(true);

useEffect(() => {
(async () => {
try {
await waitForFirebase();
const loaded = await window.__loadData();
if (loaded) setData(migrateData(loaded));
} catch (e) {
setError("No se pudo conectar con la base de datos. Revisa la configuración de Firebase.");
} finally {
setLoading(false);
}
})();
}, []);

useEffect(() => {
(async () => {
try {
await waitForFirebase();
const list = await window.__listFiles();
setFiles(list);
} catch (e) {
// si falla la lista de archivos, el resto de la app sigue funcionando
} finally {
setFilesLoading(false);
}
})();
}, []);

async function persist(newData) {
setData(newData);
setSaving(true);
try {
await window.__saveData(newData);
setError("");
} catch (e) {
setError("Error al guardar los datos. Revisa tu conexión o configuración de Firebase.");
} finally {
setSaving(false);
}
}

async function refreshFiles() {
try {
const list = await window.__listFiles();
setFiles(list);
} catch (e) {
setError("No se pudo actualizar la lista de archivos.");
}
}

async function uploadFile(file, label) {
if (file.size > MAX_FILE_BYTES) {
setError("El archivo \"" + file.name + "\" pesa demasiado (máx. " + Math.round(MAX_FILE_BYTES / 1024) + " KB). Comprímelo e inténtalo de nuevo.");
return false;
}
try {
const dataUrl = await readFileAsDataURL(file);
await window.__uploadFile({
name: label && label.trim() ? label.trim() : file.name,
type: file.type || "application/octet-stream",
dataUrl,
});
setError("");
await refreshFiles();
return true;
} catch (e) {
setError("No se pudo subir el archivo. Intenta con uno más liviano.");
return false;
}
}

async function deleteFile(id) {
if (!confirm("¿Eliminar este archivo?")) return;
try {
await window.__deleteFile(id);
await refreshFiles();
} catch (e) {
setError("No se pudo eliminar el archivo.");
}
}

if (loading) {
return (
<div className="min-h-screen flex items-center justify-center bg-slate-50">
<p className="text-slate-500 text-sm">Cargando...</p>
</div>
);
}

if (session && session.role === "teacher") {
return (
<TeacherDashboard
data={data}
persist={persist}
saving={saving}
error={error}
files={files}
filesLoading={filesLoading}
onUploadFile={uploadFile}
onDeleteFile={deleteFile}
onLogout={() => setSession(null)}
/>
);
}

return (
<HomeScreen
data={data}
files={files}
onSetTeacherPassword={async (pwd) => {
await persist({ ...data, teacherPassword: pwd });
setSession({ role: "teacher" });
}}
onLogin={() => setSession({ role: "teacher" })}
error={error}
/>
);
}

function HomeScreen({ data, files, onSetTeacherPassword, onLogin, error }) {
const [tab, setTab] = useState("parent");

return (
<div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
<div className="w-full max-w-md">
<div className="text-center mb-6">
<img src={SCHOOL_SHIELD_DATA_URL} alt="Escudo del colegio" className="inline-block w-14 h-14 mb-3 object-contain" />
<h1 className="text-xl font-semibold text-slate-800">Portal de Notas</h1>
<p className="text-sm text-slate-500 mt-1">Consulta de calificaciones</p>
</div>

<div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
<div className="flex rounded-lg bg-slate-100 p-1 mb-5">
<button type="button" onClick={() => setTab("parent")}
className={`flex-1 text-sm font-medium py-2 rounded-md transition ${tab === "parent" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>
Padres
</button>
<button type="button" onClick={() => setTab("teacher")}
className={`flex-1 text-sm font-medium py-2 rounded-md transition ${tab === "teacher" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>
Docente
</button>
</div>

{tab === "parent" ? (
<ParentSearch students={data.students} areas={data.areas} grades={data.grades} comportamiento={data.comportamiento} />
) : (
<TeacherLogin data={data} onSetTeacherPassword={onSetTeacherPassword} onLogin={onLogin} error={error} />
)}
</div>

{tab === "parent" && <ClassFiles files={files} />}
</div>
</div>
);
}

function TeacherLogin({ data, onSetTeacherPassword, onLogin, error }) {
const [password, setPassword] = useState("");
const [password2, setPassword2] = useState("");
const [loginError, setLoginError] = useState("");
const needsTeacherSetup = data.teacherPassword === null;

function handleSubmit(e) {
e.preventDefault();

{criterios.map((crit, ci) => {

<tr key={crit}>
{ci === 0 && (
<td className="px-3 py-2 border border-slate-200 font-medium text-slate-700 align-top" rowSpan={rowSpan}>{area.name}</td>

<td className="px-3 py-2 border border-slate-200 text-slate-600">{crit}</td>
{[0, 1, 2, 3].map((bIdx) => (
<td key={bIdx} className="px-1 py-1 border border-slate-200 text-center">
{editable ? (
<input className="w-12 text-center border border-slate-200 rounded px-1 py-1 text-sm" value={values[bIdx] || ""}
onChange={(e) => onUpdateCriterio(student.id, area.name, crit, bIdx, e.target.value)} placeholder="-" />
) : renderValue(values[bIdx])}

))}
{ci === 0 && (

{editable ? (
<input className="w-20 text-center border border-slate-200 rounded px-1 py-1 text-sm" value={recuperacion}

<td className="px-3 py-2 border border-slate-200 text-xs font-semibold text-slate-600" colSpan={2}>CALIF. PROMEDIO ÁREA</td>

<td key={bIdx} className="px-2 py-2 border border-slate-200 text-center text-xs font-semibold text-slate-700">

</td>

{editable ? (
<input className="w-20 text-center border border-slate-200 rounded px-1 py-1 text-sm" value={studentComportamiento.recuperacion || ""}

}

function TeacherDashboard({ data, persist, saving, error, files, filesLoading, onUploadFile, onDeleteFile, onLogout }) {
const [tab, setTab] = useState("grades");
const [search, setSearch] = useState("");
const [gradesBuffer, setGradesBuffer] = useState(data.grades);
const [comportamientoBuffer, setComportamientoBuffer] = useState(data.comportamiento || {});
const [dirty, setDirty] = useState(false);

useEffect(() => {
setGradesBuffer(data.grades);
setComportamientoBuffer(data.comportamiento || {});
setDirty(false);
}, [data.grades, data.comportamiento]);

const filteredStudents = useMemo(() => {
const q = search.trim().toLowerCase();
if (!q) return data.students;
return data.students.filter((s) => s.name.toLowerCase().includes(q));
}, [data.students, search]);

function updateCriterio(studentId, area, criterio, idx, value) {
setGradesBuffer((prev) => withCriterioValue(prev, studentId, area, criterio, idx, value));
setDirty(true);
}

function updateRecuperacion(studentId, area, value) {
setGradesBuffer((prev) => withRecuperacionValue(prev, studentId, area, value));
setDirty(true);
}

function updateComportamiento(studentId, field, value, idx) {
setComportamientoBuffer((prev) => withComportamientoValue(prev, studentId, field, value, idx));
setDirty(true);
}

async function saveGrades() {
await persist({ ...data, grades: gradesBuffer, comportamiento: comportamientoBuffer });
setDirty(false);
}

async function addArea(name) {
const clean = (name || "").trim();
if (!clean || data.areas.some((a) => a.name === clean)) return;
await persist({ ...data, areas: [...data.areas, { name: clean, criterios: [] }] });
}

async function removeArea(name) {
if (!confirm("¿Eliminar el área \"" + name + "\"? Se borrarán sus notas.")) return;
const newGrades = deepClone(data.grades);
Object.keys(newGrades).forEach((id) => { if (newGrades[id]) delete newGrades[id][name]; });
await persist({ ...data, areas: data.areas.filter((a) => a.name !== name), grades: newGrades });
}

async function addCriterio(areaName, criterioName) {
const clean = (criterioName || "").trim();
if (!clean) return;
const area = data.areas.find((a) => a.name === areaName);
if (!area) return;
if ((area.criterios || []).includes(clean)) return;
const newAreas = data.areas.map((a) => a.name === areaName ? { ...a, criterios: [...(a.criterios || []), clean] } : a);
await persist({ ...data, areas: newAreas });
}

async function removeCriterio(areaName, criterioName) {
if (!confirm("¿Eliminar el criterio \"" + criterioName + "\"? Se borrarán sus notas.")) return;
const newAreas = data.areas.map((a) => a.name === areaName ? { ...a, criterios: (a.criterios || []).filter((c) => c !== criterioName) } : a);
const newGrades = deepClone(data.grades);
Object.keys(newGrades).forEach((id) => {
if (newGrades[id] && newGrades[id][areaName] && newGrades[id][areaName].criterios) {
delete newGrades[id][areaName].criterios[criterioName];
}
});
await persist({ ...data, areas: newAreas, grades: newGrades });
}

async function addStudent(name) {
const clean = name.trim();
if (!clean) return false;
if (data.students.some((s) => normalizeName(s.name) === normalizeName(clean))) {
alert("Ya existe un alumno con ese nombre.");
return false;
}
await persist({ ...data, students: [...data.students, { id: generateId(), name: clean }] });
return true;
}

async function removeStudent(id) {
if (!confirm("¿Eliminar a este alumno y sus notas?")) return;
const newGrades = { ...data.grades };
delete newGrades[id];
const newComportamiento = { ...(data.comportamiento || {}) };
delete newComportamiento[id];
await persist({ ...data, students: data.students.filter((s) => s.id !== id), grades: newGrades, comportamiento: newComportamiento });
}

async function applyImport(imported) {
await persist(imported);
}

return (
<div className="min-h-screen bg-slate-50">
<header className="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
<div className="flex items-center gap-2">
<img src={SCHOOL_SHIELD_DATA_URL} alt="Escudo del colegio" className="w-9 h-9 object-contain" />
<div>
<p className="text-sm font-semibold text-slate-800">Panel del docente</p>
<p className="text-xs text-slate-400">{data.students.length} alumnos · {data.areas.length} áreas</p>
</div>
</div>
<div className="flex items-center gap-3"><ChangePassword data={data} persist={persist} /><button onClick={onLogout} className="text-xs font-medium text-slate-500 hover:text-red-600 transition">Salir</button></div>
</header>

<div className="px-4 pt-4">
<div className="flex rounded-lg bg-slate-100 p-1 max-w-md">
<button onClick={() => setTab("grades")} className={`flex-1 text-xs font-medium py-2 rounded-md transition ${tab === "grades" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>Notas</button>
<button onClick={() => setTab("students")} className={`flex-1 text-xs font-medium py-2 rounded-md transition ${tab === "students" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>Alumnos</button>
<button onClick={() => setTab("files")} className={`flex-1 text-xs font-medium py-2 rounded-md transition ${tab === "files" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>Archivos</button>
</div>
</div>

{error && <div className="mx-4 mt-3 text-xs bg-red-50 text-red-600 border border-red-200 rounded-lg px-3 py-2">{error}</div>}

<main className="p-4">
{tab === "students" && (
<StudentsTab students={data.students} search={search} setSearch={setSearch} filteredStudents={filteredStudents} onAdd={addStudent} onRemove={removeStudent} />
)}
{tab === "grades" && (
<GradesTab data={data} filteredStudents={filteredStudents} search={search} setSearch={setSearch}
gradesBuffer={gradesBuffer} comportamientoBuffer={comportamientoBuffer}
updateCriterio={updateCriterio} updateRecuperacion={updateRecuperacion} updateComportamiento={updateComportamiento}
addArea={addArea} removeArea={removeArea} addCriterio={addCriterio} removeCriterio={removeCriterio}
dirty={dirty} saving={saving} onSave={saveGrades} onApplyImport={applyImport} />
)}
{tab === "files" && (
<FilesTab files={files} filesLoading={filesLoading} onUpload={onUploadFile} onDelete={onDeleteFile} />
)}
</main>
</div>
);
}

<div className="flex items-center justify-between mb-2">
<p className="text-sm font-semibold text-slate-700">{area.name}</p>
<button onClick={() => onRemoveArea(area.name)} className="text-xs text-red-500 hover:text-red-700">Eliminar área</button>
</div>
<ul className="space-y-1 mb-2">
{(area.criterios || []).map((c) => (
<li key={c} className="flex items-center justify-between text-xs text-slate-600 bg-slate-50 rounded px-2 py-1">
<span>{c}</span>
<button onClick={() => onRemoveCriterio(area.name, c)} className="text-slate-400 hover:text-red-600">✕</button>
</li>
))}
{(area.criterios || []).length === 0 && <li className="text-xs text-slate-400 italic">Sin criterios.</li>}
</ul>
<form onSubmit={(e) => { e.preventDefault(); onAddCriterio(area.name, newCriterio[area.name] || ""); setNewCriterio((prev) => ({ ...prev, [area.name]: "" })); }} className="flex gap-2">
<input className="flex-1 border border-slate-300 rounded-lg px-2 py-1.5 text-xs" placeholder="Nuevo criterio de evaluación" value={newCriterio[area.name] || ""} onChange={(e) => setNewCriterio((prev) => ({ ...prev, [area.name]: e.target.value }))} />
<button className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition">+ Criterio</button>
</form>
</div>
))}
</div>
)}
</div>
);
}

function GradesTab({ data, filteredStudents, search, setSearch, gradesBuffer, comportamientoBuffer, updateCriterio, updateRecuperacion, updateComportamiento, addArea, removeArea, addCriterio, removeCriterio, dirty, saving, onSave, onApplyImport }) {
const [selectedId, setSelectedId] = useState(null);
const [importPreview, setImportPreview] = useState(null);
const [importError, setImportError] = useState("");
const fileInputRef = React.useRef(null);

const selectedStudent = data.students.find((s) => s.id === selectedId) || null;

function downloadTemplate() {
const header = ["Nombre y apellidos"];
data.areas.forEach((area) => {
(area.criterios || []).forEach((crit) => {
BIMESTRE_LABELS.forEach((b) => header.push(area.name + " - " + crit + " - " + b));
});
header.push(area.name + " - Recuperación");
});
header.push("COMPORTAMIENTO - B1", "COMPORTAMIENTO - B2", "COMPORTAMIENTO - B3", "COMPORTAMIENTO - B4", "COMPORTAMIENTO - Final", "COMPORTAMIENTO - Recuperación");

const rows = [header];
data.students.forEach((s) => {
const row = [s.name];
const sGrades = data.grades[s.id] || {};
data.areas.forEach((area) => {
const areaData = sGrades[area.name] || { criterios: {}, recuperacion: "" };
(area.criterios || []).forEach((crit) => {
const values = (areaData.criterios || {})[crit] || ["", "", "", ""];
BIMESTRE_LABELS.forEach((b, idx) => row.push(values[idx] || ""));
});
row.push(areaData.recuperacion || "");
});
const comp = (data.comportamiento || {})[s.id] || { b: ["", "", "", ""], final: "", recuperacion: "" };
row.push(comp.b[0] || "", comp.b[1] || "", comp.b[2] || "", comp.b[3] || "", comp.final || "", comp.recuperacion || "");
rows.push(row);
});

const ws = XLSX.utils.aoa_to_sheet(rows);
const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "Notas");
XLSX.writeFile(wb, "plantilla_notas.xlsx");
}

function handleFileChange(e) {
const file = e.target.files && e.target.files[0];
e.target.value = "";
if (!file) return;
setImportError("");
const reader = new FileReader();
reader.onload = (evt) => {
try {
const wb = XLSX.read(evt.target.result, { type: "array" });
const sheet = wb.Sheets[wb.SheetNames[0]];
const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
if (!rows.length) throw new Error("empty");
const header = rows[0];
const columns = [];
for (let i = 1; i < header.length; i++) {
const h = String(header[i] || "").trim();
if (!h) continue;
if (/^COMPORTAMIENTO/i.test(h)) {
const field = h.split(" - ").slice(1).join(" - ").trim();
columns.push({ type: "comportamiento", field: field, index: i });
} else {
const parts = h.split(" - ").map((p) => p.trim());
if (parts.length === 3 && BIMESTRE_LABELS.indexOf(parts[2]) !== -1) {
columns.push({ type: "criterio", area: parts[0], criterio: parts[1], bim: parts[2], index: i });
} else if (parts.length === 2 && /recuperaci/i.test(parts[1])) {
columns.push({ type: "recuperacion", area: parts[0], index: i });
}
}
}
const dataRows = rows.slice(1).filter((r) => r[0] && String(r[0]).trim());
if (!columns.length || !dataRows.length) {
setImportError("No se detectaron columnas o alumnos reconocibles. Usa la plantilla descargable como base.");
return;
}
setImportPreview({ columns: columns, dataRows: dataRows });
} catch (err) {
setImportError("No se pudo leer el archivo. Sube un Excel (.xlsx) o CSV válido.");
}
};
reader.readAsArrayBuffer(file);
}

function confirmImport() {
if (!importPreview) return;
const columns = importPreview.columns;
const dataRows = importPreview.dataRows;
const students2 = data.students.slice();
const areas2 = data.areas.map((a) => ({ name: a.name, criterios: [...(a.criterios || [])] }));
const grades2 = deepClone(data.grades);
const comportamiento2 = deepClone(data.comportamiento || {});

dataRows.forEach((row) => {
const name = String(row[0]).trim();
if (!name) return;
let student = students2.find((s) => normalizeName(s.name) === normalizeName(name));
if (!student) {
student = { id: generateId(), name: name };
students2.push(student);
}
columns.forEach((col) => {
const raw = row[col.index];
const val = (raw === undefined || raw === null) ? "" : String(raw).trim();
if (val === "") return;
if (col.type === "criterio") {
let area = areas2.find((a) => a.name === col.area);
if (!area) { area = { name: col.area, criterios: [] }; areas2.push(area); }
if (area.criterios.indexOf(col.criterio) === -1) area.criterios.push(col.criterio);
const bimIdx = BIMESTRE_LABELS.indexOf(col.bim);
if (bimIdx === -1) return;
if (!grades2[student.id]) grades2[student.id] = {};
if (!grades2[student.id][col.area]) grades2[student.id][col.area] = { criterios: {}, recuperacion: "" };
if (!grades2[student.id][col.area].criterios) grades2[student.id][col.area].criterios = {};
if (!grades2[student.id][col.area].criterios[col.criterio]) grades2[student.id][col.area].criterios[col.criterio] = ["", "", "", ""];
grades2[student.id][col.area].criterios[col.criterio][bimIdx] = val;
} else if (col.type === "recuperacion") {
if (!grades2[student.id]) grades2[student.id] = {};
if (!grades2[student.id][col.area]) grades2[student.id][col.area] = { criterios: {}, recuperacion: "" };
grades2[student.id][col.area].recuperacion = val;
} else if (col.type === "comportamiento") {
if (!comportamiento2[student.id]) comportamiento2[student.id] = { b: ["", "", "", ""], final: "", recuperacion: "" };
if (/^final$/i.test(col.field)) comportamiento2[student.id].final = val;
else if (/recuperaci/i.test(col.field)) comportamiento2[student.id].recuperacion = val;
else {
const bimIdx = BIMESTRE_LABELS.indexOf(col.field);
if (bimIdx !== -1) comportamiento2[student.id].b[bimIdx] = val;
}
}
});
});

onApplyImport({ ...data, students: students2, areas: areas2, grades: grades2, comportamiento: comportamiento2 });
setImportPreview(null);
}

const importAreaCount = importPreview ? new Set(importPreview.columns.filter((c) => c.type !== "comportamiento").map((c) => c.area)).size : 0;

return (
<div>
<ManageAreas areas={data.areas} onAddArea={addArea} onRemoveArea={removeArea} onAddCriterio={addCriterio} onRemoveCriterio={removeCriterio} />

<div className="flex flex-wrap gap-2 mb-4 items-center">
<input className="flex-1 min-w-[180px] px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white" placeholder="Buscar alumno..." value={search} onChange={(e) => setSearch(e.target.value)} />
<button type="button" onClick={downloadTemplate} className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium px-3 py-2 rounded-lg transition">Descargar plantilla</button>
<button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()}
className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium px-3 py-2 rounded-lg transition">
Importar Excel
</button>
<input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFileChange} />
<button onClick={onSave} disabled={!dirty || saving}
className={`ml-auto text-sm font-medium px-4 py-2 rounded-lg transition ${dirty ? "bg-emerald-600 hover:bg-emerald-700 text-white" : "bg-slate-200 text-slate-400"}`}>
{saving ? "Guardando..." : dirty ? "Guardar cambios" : "Guardado"}
</button>
</div>

{importError && <p className="text-xs text-red-600 mb-3">{importError}</p>}

{importPreview && (
<div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 mb-4 text-sm">
<p className="text-indigo-800 font-medium mb-1">Vista previa de importación</p>
<p className="text-indigo-700 mb-3">
Se detectaron {importPreview.dataRows.length} alumno(s) y {importAreaCount} área(s). Los alumnos, áreas o criterios nuevos se agregarán automáticamente.
</p>
<div className="flex gap-2">
<button onClick={confirmImport} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">Aplicar cambios</button>
<button onClick={() => setImportPreview(null)} className="text-slate-500 text-sm font-medium px-4 py-2">Cancelar</button>
</div>
</div>
)}

{filteredStudents.length > 0 && (
<div className="flex flex-wrap gap-2 mb-4">
{filteredStudents.map((s) => (
<button key={s.id} onClick={() => setSelectedId(s.id)}
className={`text-xs font-medium px-3 py-1.5 rounded-full border transition ${selectedId === s.id ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-slate-600 border-slate-300 hover:bg-slate-50"}`}>
{s.name}
</button>
))}
</div>
)}
{filteredStudents.length === 0 && (
<p className="text-sm text-slate-400 mb-4">{data.students.length === 0 ? "Aún no has agregado alumnos." : "Sin resultados."}</p>
)}

{selectedStudent ? (
<LibretaTable areas={data.areas} student={selectedStudent} gradesBuffer={gradesBuffer} comportamientoBuffer={comportamientoBuffer}
editable={true} onUpdateCriterio={updateCriterio} onUpdateRecuperacion={updateRecuperacion} onUpdateComportamiento={updateComportamiento} />
) : (
<p className="text-sm text-slate-400 bg-white border border-slate-200 rounded-xl px-4 py-6 text-center">Selecciona un alumno de la lista para ver o editar su libreta.</p>
)}
</div>
);
}

function FilesTab({ files, filesLoading, onUpload, onDelete }) {
const [label, setLabel] = useState("");
const [uploading, setUploading] = useState(false);
const [uploadError, setUploadError] = useState("");
const fileInputRef = React.useRef(null);

async function handleFileSelected(e) {
const file = e.target.files && e.target.files[0];
e.target.value = "";
if (!file) return;
setUploadError("");
setUploading(true);
const ok = await onUpload(file, label);
setUploading(false);
if (ok) setLabel("");
else setUploadError("No se pudo subir el archivo. Verifica el tamano (max. " + Math.round(MAX_FILE_BYTES / 1024) + " KB).");
}

return (
<div>
<p className="text-xs text-slate-500 mb-4">
Sube imagenes, Excel u otros documentos con las notas. Los padres podran descargarlos desde la busqueda. Tamano maximo por archivo: {Math.round(MAX_FILE_BYTES / 1024)} KB.
</p>
<div className="bg-white border border-slate-200 rounded-xl p-4 mb-4 flex flex-wrap gap-2 items-center">
<input className="flex-1 min-w-[180px] border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Nombre del archivo (opcional)" value={label} onChange={(e) => setLabel(e.target.value)} />
<button type="button" disabled={uploading} onClick={() => fileInputRef.current && fileInputRef.current.click()}
className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition disabled:opacity-50">
{uploading ? "Subiendo..." : "Subir archivo"}
</button>
<input ref={fileInputRef} type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv" className="hidden" onChange={handleFileSelected} />
</div>
{uploadError && <p className="text-xs text-red-600 mb-3">{uploadError}</p>}

<div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
<table className="w-full text-sm">
<thead><tr className="bg-slate-50 text-slate-500 text-xs uppercase text-left"><th className="px-4 py-2">Archivo</th><th className="px-4 py-2 w-10"></th></tr></thead>
<tbody>
{filesLoading && (<tr><td colSpan={2} className="px-4 py-6 text-center text-slate-400 text-sm">Cargando...</td></tr>)}
{!filesLoading && files.length === 0 && (<tr><td colSpan={2} className="px-4 py-6 text-center text-slate-400 text-sm">Aun no has subido archivos.</td></tr>)}
{files.map((f) => (
<tr key={f.id} className="border-t border-slate-100">
<td className="px-4 py-2 text-slate-700"><a href={f.dataUrl} download={f.name} className="text-indigo-700 hover:underline">{f.name}</a></td>
<td className="px-4 py-2 text-right"><button onClick={() => onDelete(f.id)} className="text-slate-400 hover:text-red-600">Eliminar</button></td>
</tr>
))}
</tbody>
</table>
</div>
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
