<!DOCTYPE html>
<html lang="es">
     <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Portal de Notas</title>
     <script src="https://cdn.tailwindcss.com"></script>
     <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
     <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
     <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
     <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
     </head>
<body>
     <div id="root"></div>

     <!-- ====================================================================
          CONFIGURACIÓN DE FIREBASE (ya conectada al proyecto notas-clase)
     ====================================================================== -->
     <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
            import { getFirestore, doc, getDoc, setDoc, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

            const firebaseConfig = {
                     apiKey: "AIzaSyDUr6cxFEdkOpXjKTpGil8-sAor_CbdUXU",
                     authDomain: "notas-clase-1d0d4.firebaseapp.com",
                     projectId: "notas-clase-1d0d4",
                     storageBucket: "notas-clase-1d0d4.firebasestorage.app",
                     messagingSenderId: "352792565163",
                     appId: "1:352792565163:web:f4e2f088603852f803eeee"
            };

            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const dataRef = doc(db, "classroom", "data");
            const filesCol = collection(db, "classroom_files");

            window.__loadData = async function () {
                     const snap = await getDoc(dataRef);
                     if (snap.exists()) return snap.data();
                              return null;
            };

            window.__saveData = async function (data) {
                     await setDoc(dataRef, data);
                     return true;
            };

            window.__listFiles = async function () {
                     const snap = await getDocs(filesCol);
                     const list = [];
                     snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
                     list.sort((a, b) => (b.uploadedAt || 0) - (a.uploadedAt || 0));
                     return list;
            };

            window.__uploadFile = async function (file) {
                     await addDoc(filesCol, { ...file, uploadedAt: Date.now() });
                     return true;
            };

            window.__deleteFile = async function (id) {
                     await deleteDoc(doc(db, "classroom_files", id));
                     return true;
            };

            // Señal de que Firebase ya está listo para usarse
            window.__firebaseReady = true;
            window.dispatchEvent(new Event("firebase-ready"));
     </script>

     <script type="text/babel">
          const { useState, useEffect, useMemo } = React;

          const emptyData = () => ({
                 teacherPassword: null,
                 students: [],
                 subjects: [],
                 grades: {},
          });

          const MAX_FILE_BYTES = 700 * 1024;

          function generateId() {
                 return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
          }

function normalizeName(value) {
       var from = "áéíóúüñÁÉÍÓÚÜÑ";
       var to = "aeiouunAEIOUUN";
       var s = (value || "").toString().trim().replace(/\s+/g, " ").toLowerCase();
       var result = "";
       for (var i = 0; i < s.length; i++) {
                var idx = from.indexOf(s[i]);
                result += idx >= 0 ? to[idx] : s[i];
       }
       return result;
}

          function waitForFirebase() {
                 return new Promise((resolve) => {
                          if (window.__firebaseReady) return resolve();
                          window.addEventListener("firebase-ready", () => resolve(), { once: true });
                 });
          }

          function readFileAsDataURL(file) {
                 return new Promise((resolve, reject) => {
                          const reader = new FileReader();
                          reader.onload = () => resolve(reader.result);
                          reader.onerror = () => reject(reader.error);
                          reader.readAsDataURL(file);
                 });
          }
          
function App() {
                 const [loading, setLoading] = useState(true);
                 const [data, setData] = useState(emptyData());
                 const [error, setError] = useState("");
                 const [session, setSession] = useState(null);
                 const [saving, setSaving] = useState(false);
                 const [files, setFiles] = useState([]);
                 const [filesLoading, setFilesLoading] = useState(true);

            useEffect(() => {
                     (async () => {
                                try {
                                             await waitForFirebase();
                                             const loaded = await window.__loadData();
                                             if (loaded) setData({ ...emptyData(), ...loaded });
                                } catch (e) {
                                             setError("No se pudo conectar con la base de datos. Revisa la configuración de Firebase.");
                                } finally {
                                             setLoading(false);
                                }
                     })();
            }, []);

            useEffect(() => {
                     (async () => {
                                try {
                                             await waitForFirebase();
                                             const list = await window.__listFiles();
                                             setFiles(list);
                                } catch (e) {
                                             // si falla la lista de archivos, el resto de la app sigue funcionando
                                } finally {
                                             setFilesLoading(false);
                                }
                     })();
            }, []);

            async function persist(newData) {
                     setData(newData);
                     setSaving(true);
                     try {
                                await window.__saveData(newData);
                                setError("");
                     } catch (e) {
                                setError("Error al guardar los datos. Revisa tu conexión o configuración de Firebase.");
                     } finally {
                                setSaving(false);
                     }
            }

            async function refreshFiles() {
                     try {
                                const list = await window.__listFiles();
                                setFiles(list);
                     } catch (e) {
                                setError("No se pudo actualizar la lista de archivos.");
                     }
            }

            async function uploadFile(file, label) {
                     if (file.size > MAX_FILE_BYTES) {
                                setError("El archivo \"" + file.name + "\" pesa demasiado (máx. " + Math.round(MAX_FILE_BYTES / 1024) + " KB). Comprímelo e inténtalo de nuevo.");
                                return false;
                     }
                     try {
                                const dataUrl = await readFileAsDataURL(file);
                                await window.__uploadFile({
                                             name: label && label.trim() ? label.trim() : file.name,
                                             type: file.type || "application/octet-stream",
                                             dataUrl,
                                });
                                setError("");
                                await refreshFiles();
                                return true;
                     } catch (e) {
                                setError("No se pudo subir el archivo. Intenta con uno más liviano.");
                                return false;
                     }
            }

            async function deleteFile(id) {
                     if (!confirm("¿Eliminar este archivo?")) return;
                     try {
                                await window.__deleteFile(id);
                                await refreshFiles();
                     } catch (e) {
                                setError("No se pudo eliminar el archivo.");
                     }
            }

            if (loading) {
                     return (
                                <div className="min-h-screen flex items-center justify-center bg-slate-50">
                                             <p className="text-slate-500 text-sm">Cargando...</p>
                                </div>
                              );
            }

            if (session && session.role === "teacher") {
                     return (
                                <TeacherDashboard
                                             data={data}
                                             persist={persist}
                                             saving={saving}
                                             error={error}
                                             files={files}
                                             filesLoading={filesLoading}
                                             onUploadFile={uploadFile}
                                             onDeleteFile={deleteFile}
                                             onLogout={() => setSession(null)}
                                           />
                              );
            }

            return (
                     <HomeScreen
                                data={data}
                                files={files}
                                onSetTeacherPassword={async (pwd) => {
                                             await persist({ ...data, teacherPassword: pwd });
                                             setSession({ role: "teacher" });
                                }}
                                onLogin={() => setSession({ role: "teacher" })}
                                error={error}
                              />
                   );
          }

          function HomeScreen({ data, files, onSetTeacherPassword, onLogin, error }) {
                 const [tab, setTab] = useState("parent");

            return (
                     <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                                <div className="w-full max-w-md">
                                             <div className="text-center mb-6">
                                                            <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white mb-3 text-2xl">🎓</div>
                                                            <h1 className="text-xl font-semibold text-slate-800">Portal de Notas</h1>
                                                            <p className="text-sm text-slate-500 mt-1">Consulta de calificaciones</p>
                                             </div>

                                             <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                                            <div className="flex rounded-lg bg-slate-100 p-1 mb-5">
                                                                             <button type="button" onClick={() => setTab("parent")}
                                                                                                className={`flex-1 text-sm font-medium py-2 rounded-md transition ${tab === "parent" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>
                                                                                                Padres
                                                                             </button>
                                                                             <button type="button" onClick={() => setTab("teacher")}
                                                                                                className={`flex-1 text-sm font-medium py-2 rounded-md transition ${tab === "teacher" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>
                                                                                                Profesora
                                                                             </button>
                                                            </div>

                                                  {tab === "parent" ? (
                                      <ParentSearch students={data.students} subjects={data.subjects} grades={data.grades} />
                                    ) : (
                                      <TeacherLogin data={data} onSetTeacherPassword={onSetTeacherPassword} onLogin={onLogin} error={error} />
                                    )}
                                             </div>

                                     {tab === "parent" && <ClassFiles files={files} />}
                                </div>
                     </div>
                   );
          }

          function TeacherLogin({ data, onSetTeacherPassword, onLogin, error }) {
                 const [password, setPassword] = useState("");
                 const [password2, setPassword2] = useState("");
                 const [loginError, setLoginError] = useState("");
                 const needsTeacherSetup = data.teacherPassword === null;

            function handleSubmit(e) {
                     e.preventDefault();
                     setLoginError("");
                     if (needsTeacherSetup) {
                                if (password.length < 4) return setLoginError("La contraseña debe tener al menos 4 caracteres.");
                                if (password !== password2) return setLoginError("Las contraseñas no coinciden.");
                                onSetTeacherPassword(password);
                                return;
                     }
                     if (password === data.teacherPassword) onLogin();
                     else setLoginError("Contraseña incorrecta.");
            }

            return (
                     <form onSubmit={handleSubmit} className="space-y-3">
                          {needsTeacherSetup && (
                                  <p className="text-xs bg-amber-50 text-amber-700 border border-amber-200 rounded-lg px-3 py-2">
                                                 Primera vez: crea una contraseña para la cuenta de profesora.
                                  </p>
                                )}
                                <div>
                                             <label className="block text-xs font-medium text-slate-600 mb-1">
                                                  {needsTeacherSetup ? "Nueva contraseña" : "Contraseña"}
                                             </label>
                                             <input type="password" className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                            value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" autoComplete="current-password" />
                                </div>
                          {needsTeacherSetup && (
                                  <div>
                                                 <label className="block text-xs font-medium text-slate-600 mb-1">Confirmar contraseña</label>
                                                 <input type="password" className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                                  value={password2} onChange={(e) => setPassword2(e.target.value)} placeholder="••••••••" />
                                  </div>
                                )}
                          {loginError && <p className="text-xs text-red-600">{loginError}</p>}
                          {error && <p className="text-xs text-red-600">{error}</p>}
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2.5 rounded-lg transition">
                                     {needsTeacherSetup ? "Crear contraseña y entrar" : "Iniciar sesión"}
                                </button>
                     </form>
                   );
          }

          function ParentSearch({ students, subjects, grades }) {
                 const [query, setQuery] = useState("");
                 const [result, setResult] = useState(undefined);

            function handleSearch(e) {
                     e.preventDefault();
                     const norm = normalizeName(query);
                     if (!norm) { setResult(null); return; }
                     const match = students.find((s) => normalizeName(s.name) === norm);
                     setResult(match || null);
            }

            return (
                     <div>
                                <p className="text-xs text-slate-500 mb-3">
                                             Escribe el nombre y apellidos completos de tu hijo/a, tal como están registrados, para ver sus notas.
                                </p>
                                <form onSubmit={handleSearch} className="flex gap-2 mb-4">
                                             <input className="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                            value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Nombre y apellidos completos" />
                                             <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">Buscar</button>
                                </form>

                          {result === null && (
                                  <p className="text-xs bg-red-50 text-red-600 border border-red-200 rounded-lg px-3 py-2">
                                                 No se encontró ningún alumno con ese nombre exacto. Verifica que esté completo y bien escrito.
                                  </p>
                                )}

                          {result && (
                                  <div>
                                                 <p className="text-sm font-medium text-slate-700 mb-2">{result.name}</p>
                                       {subjects.length === 0 ? (
                                                   <p className="text-sm text-slate-400 bg-slate-50 border border-slate-200 rounded-xl px-4 py-6 text-center">Aún no hay materias registradas.</p>
                                                 ) : (
                                                   <div className="bg-slate-50 border border-slate-200 rounded-xl overflow-hidden">
                                                        {subjects.map((subj, i) => {
                                                                        const g = (grades[result.id] || {})[subj];
                                                                        return (
                                                                                               <div key={subj} className={`flex items-center justify-between px-4 py-3 ${i !== 0 ? "border-t border-slate-100" : ""}`}>
                                                                                                                        <span className="text-sm text-slate-700">{subj}</span>
                                                                                                                        <span className="text-sm font-semibold text-indigo-700">{g !== undefined && g !== "" ? g : "—"}</span>
                                                                                                    </div>
                                                                                             );
                                                   })}
                                                   </div>
                                                 )}
                                  </div>
                                )}
                     </div>
                   );
          }

          function ClassFiles({ files }) {
                 if (!files || files.length === 0) return null;
                 return (
                          <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-4 mt-4">
                                     <p className="text-sm font-medium text-slate-700 mb-2">Documentos de la profesora</p>
                                     <ul className="space-y-1">
                                          {files.map((f) => (
                                         <li key={f.id}>
                                                          <a href={f.dataUrl} download={f.name} className="text-sm text-indigo-700 hover:underline">{f.name}</a>
                                         </li>
                                       ))}
                                     </ul>
                          </div>
                        );
          }

          function ChangePassword({ data, persist }) {
               const [open, setOpen] = useState(false);
               const [current, setCurrent] = useState("");
               const [next, setNext] = useState("");
               const [next2, setNext2] = useState("");
               const [msg, setMsg] = useState("");
               const [msgType, setMsgType] = useState("");
               const [saving, setSaving] = useState(false);
               
               async function handleSubmit(e) {
                    e.preventDefault();
                    setMsg("");
                    if (current !== data.teacherPassword) { setMsg("La contrasena actual no es correcta."); setMsgType("error"); return; }
                    if (next.length < 4) { setMsg("La nueva contrasena debe tener al menos 4 caracteres."); setMsgType("error"); return; }
                    if (next !== next2) { setMsg("Las contrasenas nuevas no coinciden."); setMsgType("error"); return; }
                    setSaving(true);
                    await persist({ ...data, teacherPassword: next });
                    setSaving(false);
                    setCurrent("");
                    setNext("");
                    setNext2("");
                    setMsg("Contrasena actualizada correctamente.");
                    setMsgType("success");
               }
               
               return (
                    <div>
                         <button type="button" onClick={() => { setOpen((v) => !v); setMsg(""); }} className="text-xs font-medium text-slate-500 hover:text-indigo-600 transition">
                              Cambiar contrasena
                         </button>
                         {open && (
                         <div className="fixed inset-0 bg-black/30 flex items-center justify-center z-30 p-4" onClick={() => setOpen(false)}>
                              <form onSubmit={handleSubmit} onClick={(e) => e.stopPropagation()} className="bg-white border border-slate-200 rounded-xl shadow-lg p-5 w-full max-w-sm space-y-3">
                                   <div className="flex items-center justify-between">
                                        <p className="text-sm font-medium text-slate-700">Cambiar contrasena</p>
                                        <button type="button" onClick={() => setOpen(false)} className="text-slate-400">X</button>
                                   </div>
                                   <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Contrasena actual</label>
                                        <input type="password" className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value={current} onChange={(e) => setCurrent(e.target.value)} autoFocus />
                                   </div>
                                   <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Nueva contrasena</label>
                                        <input type="password" className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value={next} onChange={(e) => setNext(e.target.value)} />
                                   </div>
                                   <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Confirmar nueva contrasena</label>
                                        <input type="password" className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value={next2} onChange={(e) => setNext2(e.target.value)} />
                                   </div>
                                   {msg && <p className={msgType === "error" ? "text-xs text-red-600" : "text-xs text-emerald-600"}>{msg}</p>}
                                   <button type="submit" disabled={saving} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2.5 rounded-lg transition disabled:opacity-50">
                                        {saving ? "Guardando..." : "Actualizar contrasena"}
                                   </button>
                              </form>
                         </div>
                         )}
                    </div>
                    );
          }
          
          function TeacherDashboard({ data, persist, saving, error, files, filesLoading, onUploadFile, onDeleteFile, onLogout }) {
                 const [tab, setTab] = useState("grades");
                 const [search, setSearch] = useState("");
                 const [gradesBuffer, setGradesBuffer] = useState(data.grades);
                 const [dirty, setDirty] = useState(false);

            useEffect(() => { setGradesBuffer(data.grades); setDirty(false); }, [data.grades]);

            const filteredStudents = useMemo(() => {
                     const q = search.trim().toLowerCase();
                     if (!q) return data.students;
                     return data.students.filter((s) => s.name.toLowerCase().includes(q));
            }, [data.students, search]);

            function updateGrade(studentId, subject, value) {
                     setGradesBuffer((prev) => ({ ...prev, [studentId]: { ...(prev[studentId] || {}), [subject]: value } }));
                     setDirty(true);
            }

            async function saveGrades() { await persist({ ...data, grades: gradesBuffer }); setDirty(false); }

            async function addSubject(name) {
                     const clean = name.trim();
                     if (!clean || data.subjects.includes(clean)) return;
                     await persist({ ...data, subjects: [...data.subjects, clean] });
            }

            async function removeSubject(name) {
                     if (!confirm("¿Eliminar la materia \"" + name + "\"? Se borrarán sus notas.")) return;
                     const newGrades = { ...data.grades };
                     Object.keys(newGrades).forEach((id) => { if (newGrades[id]) delete newGrades[id][name]; });
                     await persist({ ...data, subjects: data.subjects.filter((s) => s !== name), grades: newGrades });
            }

            async function addStudent(name) {
                     const clean = name.trim();
                     if (!clean) return false;
                     if (data.students.some((s) => normalizeName(s.name) === normalizeName(clean))) {
                                alert("Ya existe un alumno con ese nombre.");
                                return false;
                     }
                     await persist({ ...data, students: [...data.students, { id: generateId(), name: clean }] });
                     return true;
            }

            async function removeStudent(id) {
                     if (!confirm("¿Eliminar a este alumno y sus notas?")) return;
                     const newGrades = { ...data.grades };
                     delete newGrades[id];
                     await persist({ ...data, students: data.students.filter((s) => s.id !== id), grades: newGrades });
            }

            async function applyImport(imported) {
                     await persist(imported);
            }

            return (
                     <div className="min-h-screen bg-slate-50">
                                <header className="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
                                             <div className="flex items-center gap-2">
                                                            <div className="w-9 h-9 rounded-lg bg-indigo-600 text-white flex items-center justify-center">🎓</div>
                                                            <div>
                                                                             <p className="text-sm font-semibold text-slate-800">Panel de la profesora</p>
                                                                             <p className="text-xs text-slate-400">{data.students.length} alumnos · {data.subjects.length} materias</p>
                                                            </div>
                                             </div>
                                             <div className="flex items-center gap-3"><ChangePassword data={data} persist={persist} /><button onClick={onLogout} className="text-xs font-medium text-slate-500 hover:text-red-600 transition">Salir</button></div>
                                </header>

                                <div className="px-4 pt-4">
                                             <div className="flex rounded-lg bg-slate-100 p-1 max-w-md">
                                                            <button onClick={() => setTab("grades")} className={`flex-1 text-xs font-medium py-2 rounded-md transition ${tab === "grades" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>Notas</button>
                                                            <button onClick={() => setTab("students")} className={`flex-1 text-xs font-medium py-2 rounded-md transition ${tab === "students" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>Alumnos</button>
                                                            <button onClick={() => setTab("files")} className={`flex-1 text-xs font-medium py-2 rounded-md transition ${tab === "files" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>Archivos</button>
                                             </div>
                                </div>

                          {error && <div className="mx-4 mt-3 text-xs bg-red-50 text-red-600 border border-red-200 rounded-lg px-3 py-2">{error}</div>}

                                <main className="p-4">
                                     {tab === "students" && (
                                    <StudentsTab students={data.students} search={search} setSearch={setSearch} filteredStudents={filteredStudents} onAdd={addStudent} onRemove={removeStudent} />
                                  )}
                                     {tab === "grades" && (
                                    <GradesTab data={data} students={filteredStudents} search={search} setSearch={setSearch}
                                                     gradesBuffer={gradesBuffer} updateGrade={updateGrade} addSubject={addSubject} removeSubject={removeSubject}
                                                     dirty={dirty} saving={saving} onSave={saveGrades} onApplyImport={applyImport} />
                                  )}
                                     {tab === "files" && (
                                    <FilesTab files={files} filesLoading={filesLoading} onUpload={onUploadFile} onDelete={onDeleteFile} />
                                  )}
                                </main>
                     </div>
                   );
          }

          function StudentsTab({ students, search, setSearch, filteredStudents, onAdd, onRemove }) {
                 const [showForm, setShowForm] = useState(false);
                 const [name, setName] = useState("");
                 const [formError, setFormError] = useState("");

            async function handleAdd(e) {
                     e.preventDefault();
                     setFormError("");
                     if (!name.trim()) return setFormError("Escribe el nombre completo del alumno.");
                     const ok = await onAdd(name);
                     if (ok !== false) { setName(""); setShowForm(false); }
            }

            return (
                     <div>
                                <div className="flex gap-2 mb-4">
                                             <input className="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white" placeholder="Buscar alumno..." value={search} onChange={(e) => setSearch(e.target.value)} />
                                             <button onClick={() => setShowForm((v) => !v)} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3 py-2 rounded-lg transition">+ Alumno</button>
                                </div>

                          {showForm && (
                                  <form onSubmit={handleAdd} className="bg-white border border-slate-200 rounded-xl p-4 mb-4 space-y-3">
                                                 <div className="flex items-center justify-between">
                                                                  <p className="text-sm font-medium text-slate-700">Nuevo alumno</p>
                                                                  <button type="button" onClick={() => setShowForm(false)} className="text-slate-400">✕</button>
                                                 </div>
                                                 <input className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Nombre y apellidos completos" value={name} onChange={(e) => setName(e.target.value)} />
                                       {formError && <p className="text-xs text-red-600">{formError}</p>}
                                                 <button className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">Guardar alumno</button>
                                  </form>
                                )}

                                <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
                                             <table className="w-full text-sm">
                                                            <thead><tr className="bg-slate-50 text-slate-500 text-xs uppercase text-left"><th className="px-4 py-2">Nombre completo</th><th className="px-4 py-2 w-10"></th></tr></thead>
                                                            <tbody>
                                                                 {filteredStudents.length === 0 && (
                                        <tr><td colSpan={2} className="px-4 py-6 text-center text-slate-400 text-sm">{students.length === 0 ? "Aún no has agregado alumnos." : "Sin resultados."}</td></tr>
                                      )}
                                                                 {filteredStudents.map((s) => (
                                        <tr key={s.id} className="border-t border-slate-100">
                                                             <td className="px-4 py-2 text-slate-700">{s.name}</td>
                                                             <td className="px-4 py-2 text-right"><button onClick={() => onRemove(s.id)} className="text-slate-400 hover:text-red-600">🗑</button></td>
                                        </tr>
                                      ))}
                                                            </tbody>
                                             </table>
                                </div>
                     </div>
                   );
          }

          function GradesTab({ data, students, search, setSearch, gradesBuffer, updateGrade, addSubject, removeSubject, dirty, saving, onSave, onApplyImport }) {
                 const [newSubject, setNewSubject] = useState("");
                 const [importPreview, setImportPreview] = useState(null);
                 const [importError, setImportError] = useState("");
                 const fileInputRef = React.useRef(null);

            function handleFileChange(e) {
                     const file = e.target.files && e.target.files[0];
                     e.target.value = "";
                     if (!file) return;
                     setImportError("");
                     const reader = new FileReader();
                     reader.onload = (evt) => {
                                try {
                                             const wb = XLSX.read(evt.target.result, { type: "array" });
                                             const sheet = wb.Sheets[wb.SheetNames[0]];
                                             const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                                             if (!rows.length) throw new Error("empty");
                                             const header = rows[0];
                                             const subjectsFromFile = header.slice(1).map((h) => String(h).trim()).filter(Boolean);
                                             const dataRows = rows.slice(1).filter((r) => r[0] && String(r[0]).trim());
                                             if (!subjectsFromFile.length || !dataRows.length) {
                                                            setImportError("No se detectaron materias o alumnos. La primera fila debe tener el nombre de las materias y la primera columna el nombre de cada alumno.");
                                                            return;
                                             }
                                             setImportPreview({ subjectsFromFile, dataRows });
                                } catch (err) {
                                             setImportError("No se pudo leer el archivo. Sube un Excel (.xlsx) o CSV válido.");
                                }
                     };
                     reader.readAsArrayBuffer(file);
            }

            function confirmImport() {
                     if (!importPreview) return;
                     const subjectsFromFile = importPreview.subjectsFromFile;
                     const dataRows = importPreview.dataRows;
                     const students2 = data.students.slice();
                     const subjects2 = data.subjects.slice();
                     const grades2 = { ...data.grades };
                     subjectsFromFile.forEach((sub) => { if (subjects2.indexOf(sub) === -1) subjects2.push(sub); });
                     dataRows.forEach((row) => {
                                const name = String(row[0]).trim();
                                let student = students2.find((s) => normalizeName(s.name) === normalizeName(name));
                                if (!student) {
                                             student = { id: generateId(), name: name };
                                             students2.push(student);
                                }
                                const studentGrades = { ...(grades2[student.id] || {}) };
                                subjectsFromFile.forEach((sub, idx) => {
                                             const val = row[idx + 1];
                                             if (val !== undefined && val !== null && String(val).trim() !== "") {
                                                            studentGrades[sub] = String(val).trim();
                                             }
                                });
                                grades2[student.id] = studentGrades;
                     });
                     onApplyImport({ ...data, students: students2, subjects: subjects2, grades: grades2 });
                     setImportPreview(null);
            }

            return (
                     <div>
                                <div className="flex flex-wrap gap-2 mb-4 items-center">
                                             <input className="flex-1 min-w-[180px] px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white" placeholder="Buscar alumno..." value={search} onChange={(e) => setSearch(e.target.value)} />
                                             <form onSubmit={(e) => { e.preventDefault(); addSubject(newSubject); setNewSubject(""); }} className="flex gap-2">
                                                            <input className="border border-slate-300 rounded-lg px-3 py-2 text-sm w-36" placeholder="Nueva materia" value={newSubject} onChange={(e) => setNewSubject(e.target.value)} />
                                                            <button className="bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium px-3 py-2 rounded-lg transition">Agregar</button>
                                             </form>
                                             <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                                            className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium px-3 py-2 rounded-lg transition">
                                                            Importar Excel
                                             </button>
                                             <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFileChange} />
                                             <button onClick={onSave} disabled={!dirty || saving}
                                                            className={`ml-auto text-sm font-medium px-4 py-2 rounded-lg transition ${dirty ? "bg-emerald-600 hover:bg-emerald-700 text-white" : "bg-slate-200 text-slate-400"}`}>
                                                  {saving ? "Guardando..." : dirty ? "Guardar cambios" : "Guardado"}
                                             </button>
                                </div>

                          {importError && <p className="text-xs text-red-600 mb-3">{importError}</p>}

                          {importPreview && (
                                  <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 mb-4 text-sm">
                                                 <p className="text-indigo-800 font-medium mb-1">Vista previa de importación</p>
                                                 <p className="text-indigo-700 mb-3">
                                                                  Se detectaron {importPreview.dataRows.length} alumno(s) y {importPreview.subjectsFromFile.length} materia(s): {importPreview.subjectsFromFile.join(", ")}. Los alumnos o materias nuevos se agregarán automáticamente.
                                                 </p>
                                                 <div className="flex gap-2">
                                                                  <button onClick={confirmImport} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">Aplicar cambios</button>
                                                                  <button onClick={() => setImportPreview(null)} className="text-slate-500 text-sm font-medium px-4 py-2">Cancelar</button>
                                                 </div>
                                  </div>
                                )}

                          {data.subjects.length === 0 ? (
                                  <p className="text-sm text-slate-400 bg-white border border-slate-200 rounded-xl px-4 py-6 text-center">Agrega al menos una materia para empezar a cargar notas.</p>
                                ) : (
                                  <div className="bg-white border border-slate-200 rounded-xl overflow-x-auto">
                                                 <table className="text-sm min-w-full">
                                                                  <thead>
                                                                                     <tr className="bg-slate-50 text-slate-500 text-xs uppercase">
                                                                                                          <th className="px-4 py-2 text-left sticky left-0 bg-slate-50">Alumno</th>
                                                                                          {data.subjects.map((subj) => (
                                                         <th key={subj} className="px-3 py-2 text-center whitespace-nowrap">
                                                                                  <div className="flex items-center justify-center gap-1">{subj}<button onClick={() => removeSubject(subj)} className="text-slate-300 hover:text-red-500">✕</button></div>
                                                         </th>
                                                       ))}
                                                                                          </tr>
                                                                  </thead>
                                                                  <tbody>
                                                                       {students.length === 0 && (<tr><td colSpan={data.subjects.length + 1} className="px-4 py-6 text-center text-slate-400">Sin alumnos que mostrar.</td></tr>)}
                                                                       {students.map((s) => (
                                                       <tr key={s.id} className="border-t border-slate-100">
                                                                              <td className="px-4 py-2 text-slate-700 whitespace-nowrap sticky left-0 bg-white">{s.name}</td>
                                                            {data.subjects.map((subj) => (
                                                                                <td key={subj} className="px-2 py-1.5 text-center">
                                                                                                           <input className="w-16 text-center border border-slate-200 rounded-md px-1 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                                                                                                        value={(gradesBuffer[s.id] && gradesBuffer[s.id][subj]) || ""}
                                                                                                                                        onChange={(e) => updateGrade(s.id, subj, e.target.value)} placeholder="-" />
                                                                                     </td>
                                                                              ))}
                                                       </tr>
                                                     ))}
                                                                  </tbody>
                                                 </table>
                                  </div>
                                )}
                     </div>
                   );
          }

          function FilesTab({ files, filesLoading, onUpload, onDelete }) {
               const [label, setLabel] = useState("");
               const [uploading, setUploading] = useState(false);
               const [uploadError, setUploadError] = useState("");
               const fileInputRef = React.useRef(null);

          async function handleFileSelected(e) {
               const file = e.target.files && e.target.files[0];
               e.target.value = "";
               if (!file) return;
               setUploadError("");
               setUploading(true);
               const ok = await onUpload(file, label);
               setUploading(false);
               if (ok) setLabel("");
               else setUploadError("No se pudo subir el archivo. Verifica el tamano (max. " + Math.round(MAX_FILE_BYTES / 1024) + " KB).");
          }

          return (
               <div>
                    <p className="text-xs text-slate-500 mb-4">
                         Sube imagenes, Excel u otros documentos con las notas. Los padres podran descargarlos desde la busqueda. Tamano maximo por archivo: {Math.round(MAX_FILE_BYTES / 1024)} KB.
                    </p>
                    <div className="bg-white border border-slate-200 rounded-xl p-4 mb-4 flex flex-wrap gap-2 items-center">
                         <input className="flex-1 min-w-[180px] border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Nombre del archivo (opcional)" value={label} onChange={(e) => setLabel(e.target.value)} />
                         <button type="button" disabled={uploading} onClick={() => fileInputRef.current && fileInputRef.current.click()}
                              className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition disabled:opacity-50">
                              {uploading ? "Subiendo..." : "Subir archivo"}
                         </button>
                         <input ref={fileInputRef} type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv" className="hidden" onChange={handleFileSelected} />
                    </div>
                    {uploadError && <p className="text-xs text-red-600 mb-3">{uploadError}</p>}

                    <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
                         <table className="w-full text-sm">
                              <thead><tr className="bg-slate-50 text-slate-500 text-xs uppercase text-left"><th className="px-4 py-2">Archivo</th><th className="px-4 py-2 w-10"></th></tr></thead>
                              <tbody>
                                   {filesLoading && (<tr><td colSpan={2} className="px-4 py-6 text-center text-slate-400 text-sm">Cargando...</td></tr>)}
                                   {!filesLoading && files.length === 0 && (<tr><td colSpan={2} className="px-4 py-6 text-center text-slate-400 text-sm">Aun no has subido archivos.</td></tr>)}
                                   {files.map((f) => (
                    <tr key={f.id} className="border-t border-slate-100">
                         <td className="px-4 py-2 text-slate-700"><a href={f.dataUrl} download={f.name} className="text-indigo-700 hover:underline">{f.name}</a></td>
                         <td className="px-4 py-2 text-right"><button onClick={() => onDelete(f.id)} className="text-slate-400 hover:text-red-600">Eliminar</button></td>
                    </tr>
                    ))}
                              </tbody>
                         </table>
                    </div>
               </div>
               );
          }

          ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
