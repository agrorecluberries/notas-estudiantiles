<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal de Notas</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- ====================================================================
     CONFIGURACIÓN DE FIREBASE
          Reemplaza el objeto de abajo con el que te da tu propio proyecto
               de Firebase (ver README.md para el paso a paso).
               ====================================================================== -->
               <script type="module">
                 import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
                   import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

                     const firebaseConfig = {
                              apiKey: "AIzaSyDUr6cxFEdkOpXjKTpGil8-sAor_CbdUXU",
                              authDomain: "notas-clase-1d0d4.firebaseapp.com",
                              projectId: "notas-clase-1d0d4",
                              storageBucket: "notas-clase-1d0d4.firebasestorage.app",
                              messagingSenderId: "352792565163",
                              appId: "1:352792565163:web:f4e2f088603852f803eeee"
                     };

                                                 const app = initializeApp(firebaseConfig);
                                                   const db = getFirestore(app);
                                                     const dataRef = doc(db, "classroom", "data");

                                                       window.__loadData = async function () {
                                                           const snap = await getDoc(dataRef);
                                                               if (snap.exists()) return snap.data();
                                                                   return null;
                                                                     };

                                                                       window.__saveData = async function (data) {
                                                                           await setDoc(dataRef, data);
                                                                               return true;
                                                                                 };

                                                                                   // Señal de que Firebase ya está listo para usarse
                                                                                     window.__firebaseReady = true;
                                                                                       window.dispatchEvent(new Event("firebase-ready"));
                                                                                       </script>

                                                                                       <script type="text/babel">
                                                                                       const { useState, useEffect, useMemo } = React;

                                                                                       const emptyData = () => ({
                                                                                         teacherPassword: null,
                                                                                           students: [],
                                                                                             subjects: [],
                                                                                               grades: {},
                                                                                               });

                                                                                               const TEACHER_USERNAME = "profesora";

                                                                                               function waitForFirebase() {
                                                                                                 return new Promise((resolve) => {
                                                                                                     if (window.__firebaseReady) return resolve();
                                                                                                         window.addEventListener("firebase-ready", () => resolve(), { once: true });
                                                                                                           });
                                                                                                           }
                                                                                                           
                                                                                                           function App() {
                                                                                                             const [loading, setLoading] = useState(true);
                                                                                                               const [data, setData] = useState(emptyData());
                                                                                                                 const [error, setError] = useState("");
                                                                                                                   const [session, setSession] = useState(null);
                                                                                                                     const [saving, setSaving] = useState(false);
                                                                                                                     
                                                                                                                       useEffect(() => {
                                                                                                                           (async () => {
                                                                                                                                 try {
                                                                                                                                         await waitForFirebase();
                                                                                                                                                 const loaded = await window.__loadData();
                                                                                                                                                         if (loaded) setData(loaded);
                                                                                                                                                               } catch (e) {
                                                                                                                                                                       setError("No se pudo conectar con la base de datos. Revisa la configuración de Firebase.");
                                                                                                                                                                             } finally {
                                                                                                                                                                                     setLoading(false);
                                                                                                                                                                                           }
                                                                                                                                                                                               })();
                                                                                                                                                                                                 }, []);
                                                                                                                                                                                                 
                                                                                                                                                                                                   async function persist(newData) {
                                                                                                                                                                                                       setData(newData);
                                                                                                                                                                                                           setSaving(true);
                                                                                                                                                                                                               try {
                                                                                                                                                                                                                     await window.__saveData(newData);
                                                                                                                                                                                                                           setError("");
                                                                                                                                                                                                                               } catch (e) {
                                                                                                                                                                                                                                     setError("Error al guardar los datos. Revisa tu conexión o configuración de Firebase.");
                                                                                                                                                                                                                                         } finally {
                                                                                                                                                                                                                                               setSaving(false);
                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                     
                                                                                                                                                                                                                                                       if (loading) {
                                                                                                                                                                                                                                                           return (
                                                                                                                                                                                                                                                                 <div className="min-h-screen flex items-center justify-center bg-slate-50">
                                                                                                                                                                                                                                                                         <p className="text-slate-500 text-sm">Cargando...</p>
                                                                                                                                                                                                                                                                               </div>
                                                                                                                                                                                                                                                                                   );
                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                     
                                                                                                                                                                                                                                                                                       if (!session) {
                                                                                                                                                                                                                                                                                           return (
                                                                                                                                                                                                                                                                                                 <LoginScreen
                                                                                                                                                                                                                                                                                                         data={data}
                                                                                                                                                                                                                                                                                                                 onSetTeacherPassword={async (pwd) => {
                                                                                                                                                                                                                                                                                                                           await persist({ ...data, teacherPassword: pwd });
                                                                                                                                                                                                                                                                                                                                     setSession({ role: "teacher", username: TEACHER_USERNAME });
                                                                                                                                                                                                                                                                                                                                             }}
                                                                                                                                                                                                                                                                                                                                                     onLogin={(role, username) => setSession({ role, username })}
                                                                                                                                                                                                                                                                                                                                                             error={error}
                                                                                                                                                                                                                                                                                                                                                                   />
                                                                                                                                                                                                                                                                                                                                                                       );
                                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                                           if (session.role === "teacher") {
                                                                                                                                                                                                                                                                                                                                                                               return (
                                                                                                                                                                                                                                                                                                                                                                                     <TeacherDashboard
                                                                                                                                                                                                                                                                                                                                                                                             data={data}
                                                                                                                                                                                                                                                                                                                                                                                                     persist={persist}
                                                                                                                                                                                                                                                                                                                                                                                                             saving={saving}
                                                                                                                                                                                                                                                                                                                                                                                                                     error={error}
                                                                                                                                                                                                                                                                                                                                                                                                                             onLogout={() => setSession(null)}
                                                                                                                                                                                                                                                                                                                                                                                                                                   />
                                                                                                                                                                                                                                                                                                                                                                                                                                       );
                                                                                                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                                                                                                           return <StudentView data={data} username={session.username} onLogout={() => setSession(null)} />;
                                                                                                                                                                                                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                                                                                                                                                                                                           
                                                                                                                                                                                                                                                                                                                                                                                                                                           function LoginScreen({ data, onSetTeacherPassword, onLogin, error }) {
                                                                                                                                                                                                                                                                                                                                                                                                                                             const [role, setRole] = useState("student");
                                                                                                                                                                                                                                                                                                                                                                                                                                               const [username, setUsername] = useState("");
                                                                                                                                                                                                                                                                                                                                                                                                                                                 const [password, setPassword] = useState("");
                                                                                                                                                                                                                                                                                                                                                                                                                                                   const [password2, setPassword2] = useState("");
                                                                                                                                                                                                                                                                                                                                                                                                                                                     const [loginError, setLoginError] = useState("");
                                                                                                                                                                                                                                                                                                                                                                                                                                                     
                                                                                                                                                                                                                                                                                                                                                                                                                                                       const needsTeacherSetup = data.teacherPassword === null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                       
                                                                                                                                                                                                                                                                                                                                                                                                                                                         function handleSubmit(e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                             e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                 setLoginError("");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                     if (role === "teacher") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                           if (needsTeacherSetup) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   if (password.length < 4) return setLoginError("La contraseña debe tener al menos 4 caracteres.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           if (password !== password2) return setLoginError("Las contraseñas no coinciden.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   onSetTeacherPassword(password);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       if (password === data.teacherPassword) onLogin("teacher", TEACHER_USERNAME);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             else setLoginError("Contraseña incorrecta.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const student = data.students.find((s) => s.username.toLowerCase() === username.trim().toLowerCase());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if (!student || student.password !== password) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     setLoginError("Usuario o contraseña incorrectos.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   onLogin("student", student.username);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       return (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 <div className="w-full max-w-sm">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         <div className="text-center mb-6">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white mb-3 text-2xl">🎓</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             <h1 className="text-xl font-semibold text-slate-800">Portal de Notas</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       <p className="text-sm text-slate-500 mt-1">Inicia sesión para continuar</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 <div className="flex rounded-lg bg-slate-100 p-1 mb-5">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             <button type="button" onClick={() => { setRole("student"); setLoginError(""); }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           className={`flex-1 text-sm font-medium py-2 rounded-md transition ${role === "student" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         Alumno
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 <button type="button" onClick={() => { setRole("teacher"); setLoginError(""); }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               className={`flex-1 text-sm font-medium py-2 rounded-md transition ${role === "teacher" ? "bg-white shadow text-indigo-700" : "text-slate-500"}`}>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             Profesora
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             <form onSubmit={handleSubmit} className="space-y-3">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         {role === "student" && (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       <label className="block text-xs font-medium text-slate-600 mb-1">Usuario</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       <input className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         value={username} onChange={(e) => setUsername(e.target.value)} placeholder="tu usuario" autoComplete="username" />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   )}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               {role === "teacher" && needsTeacherSetup && (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             <p className="text-xs bg-amber-50 text-amber-700 border border-amber-200 rounded-lg px-3 py-2">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             Primera vez: crea una contraseña para la cuenta de profesora.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       )}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 <label className="block text-xs font-medium text-slate-600 mb-1">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 {role === "teacher" && needsTeacherSetup ? "Nueva contraseña" : "Contraseña"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               </label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             <input type="password" className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" autoComplete="current-password" />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     {role === "teacher" && needsTeacherSetup && (
